# Checks every push and pull request, and publishes the game to GitHub Pages from main.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that, each push to main updates
# https://<your-user>.github.io/<repo>/ a few minutes later.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test, build, browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      lockfile-generated: ${{ steps.install.outputs.generated }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        id: install
        # Uses the committed lockfile when there is one. Otherwise it resolves the latest
        # matching versions and uploads the generated lockfile so it can be committed.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the generated lockfile
        if: steps.install.outputs.generated == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: package-lock
          path: package-lock.json

      - name: Report resolved versions
        run: |
          versions=$(node -e "const fs=require('fs');console.log(['phaser','vite','vitest','typescript','preact','@playwright/test'].map(n=>n+' '+JSON.parse(fs.readFileSync('node_modules/'+n+'/package.json','utf8')).version).join(', '))")
          echo "::notice title=Resolved versions::$versions"

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test (fails on any console error)
        run: npm run smoke

      - name: Upload smoke-test screenshots and console logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-results
          path: test-results/
          if-no-files-found: ignore

      - name: Package the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Copies the smoke-test screenshots, browser console logs, results.json and (on the first
  # run) the generated package-lock.json to the `ci-output` branch, replacing what was
  # there. That makes them readable with plain git, for reviewing a run without opening
  # the Actions page. The branch is never merged; it can be deleted at any time.
  publish-output:
    name: Publish test output to the ci-output branch
    needs: check
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download smoke-test output
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: smoke-results
          path: out/smoke

      - name: Download the generated lockfile
        if: needs.check.outputs.lockfile-generated == 'true'
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: package-lock
          path: out

      - name: Push to the ci-output branch
        env:
          TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          mkdir -p out
          cd out
          find . -type f \( -name '*.zip' -o -name '*.webm' \) -delete
          {
            echo "# CI output"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Check job result: ${CHECK_RESULT}"
          } > README.md
          git init -q -b ci-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-output
